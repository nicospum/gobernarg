<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="intGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E2A8"/>
      <stop offset="1" stop-color="#CDA434"/>
    </linearGradient>
    <linearGradient id="intNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35577F"/>
      <stop offset="1" stop-color="#101D33"/>
    </linearGradient>
    <linearGradient id="intCeleste" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79B1DD"/>
      <stop offset="1" stop-color="#4785BC"/>
    </linearGradient>
    <linearGradient id="intStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDF2F7"/>
      <stop offset="1" stop-color="#C2CEDC"/>
    </linearGradient>
    <linearGradient id="intDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E2A8"/>
      <stop offset="1" stop-color="#CDA434"/>
    </linearGradient>
    <clipPath id="intClip">
      <path d="M256,76 L394,128 L394,336 Q394,430 256,458 Q118,430 118,336 L118,128 Z"/>
    </clipPath>
  </defs>

  <!-- Escudo exterior fino -->
  <path d="M256,60 L410,114 L410,342 Q410,444 256,474 Q102,444 102,342 L102,114 Z" fill="url(#intGold)" stroke="#0D1626" stroke-width="3"/>
  <path d="M256,76 L394,128 L394,336 Q394,430 256,458 Q118,430 118,336 L118,128 Z" fill="url(#intNavy)" stroke="#CDA434" stroke-width="1.5"/>

  <!-- Banda celeste -->
  <g clip-path="url(#intClip)">
    <rect x="-70" y="146" width="700" height="112" fill="url(#intCeleste)" transform="rotate(-24 256 256)"/>
    <rect x="-70" y="196" width="700" height="12" fill="#FFFFFF" transform="rotate(-24 256 256)"/>
  </g>

  <!-- Edificio municipal / torre de reloj -->
  <g transform="translate(256,252)" stroke="#0D1626" stroke-width="2" stroke-linejoin="round">
    <rect x="-70" y="-8" width="140" height="132" fill="url(#intStone)"/>
    <g fill="#7AB8E0" stroke="none">
      <rect x="-52" y="10" width="20" height="34"/>
      <rect x="-10" y="10" width="20" height="34"/>
      <rect x="32" y="10" width="20" height="34"/>
      <rect x="-52" y="60" width="20" height="34"/>
      <rect x="-10" y="60" width="20" height="34"/>
      <rect x="32" y="60" width="20" height="34"/>
    </g>
    <rect x="-78" y="-20" width="156" height="12" fill="#1A2B45" stroke="none"/>
    <rect x="-26" y="-74" width="52" height="54" fill="url(#intStone)"/>
    <circle cx="0" cy="-46" r="17" fill="#FFFFFF" stroke="#1A2B45" stroke-width="1.5"/>
    <circle cx="0" cy="-46" r="13" fill="none" stroke="#1A2B45" stroke-width="1"/>
    <line x1="0" y1="-46" x2="0" y2="-55" stroke="#1A2B45" stroke-width="1.5"/>
    <line x1="0" y1="-46" x2="7" y2="-43" stroke="#1A2B45" stroke-width="1.5"/>
    <circle cx="0" cy="-46" r="2" fill="#C0392B"/>
    <path d="M-26,-74 L0,-96 L26,-74 Z" fill="url(#intDome)" stroke="#1A2B45" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-3" y="-102" width="6" height="10" fill="#CDA434" stroke="#1A2B45" stroke-width="1"/>
    <path d="M-18,124 L-18,100 Q0,88 18,100 L18,124 Z" fill="#1A2B45" stroke="none"/>
    <rect x="-86" y="124" width="172" height="12" fill="#1A2B45" stroke="none"/>
  </g>
</svg>
