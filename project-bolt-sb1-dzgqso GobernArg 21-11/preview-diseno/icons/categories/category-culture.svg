    <path d="M600,344 L744,200" stroke="#e0b83e" stroke-width="18" stroke-linecap="round" transform="translate(2,-4)"/>
    <path d="M742,180 L770,208 L742,196 L714,224 Z" fill="#1a2b45"/>
    <path d="M756,200 Q778,222 796,240 L770,216 Z" fill="#4a90c9"/>
