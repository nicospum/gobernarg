      <ellipse cx="-30" cy="-60" rx="20" ry="9" transform="rotate(-30 -30 -60)"/>
      <ellipse cx="-52" cy="-120" rx="20" ry="9" transform="rotate(-20 -52 -120)"/>
      <ellipse cx="-66" cy="-180" rx="18" ry="8" transform="rotate(-10 -66 -180)"/>
      <ellipse cx="-20" cy="-40" rx="20" ry="9" transform="rotate(20 -20 -40)"/>
      <ellipse cx="-44" cy="-100" rx="20" ry="9" transform="rotate(30 -44 -100)"/>
