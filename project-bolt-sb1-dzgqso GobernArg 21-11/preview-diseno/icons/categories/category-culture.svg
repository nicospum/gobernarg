    <path d="M-9,8 Q0,16 9,8" fill="none" stroke="#1a2b45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Paleta de pintor -->
  <g transform="translate(512,470)" stroke="#0d1626" stroke-width="5">
    <path d="M-130,-40 Q-160,40 -90,120 Q-10,180 70,120 Q130,60 100,-40 Q80,-110 -10,-110 Q-90,-110 -130,-40 Z" fill="url(#culGold)"/>
