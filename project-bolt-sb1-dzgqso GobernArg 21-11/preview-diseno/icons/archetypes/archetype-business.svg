    <rect x="612" y="478" width="78" height="54" rx="9" fill="url(#bizGold)"/>
    <rect x="638" y="462" width="26" height="18" rx="6" fill="#c29522"/>
    <path d="M651,480 L651,478" stroke="#1a2b45" stroke-width="5"/>
    <line x1="612" y1="506" x2="690" y2="506" stroke="#1a2b45" stroke-width="4"/>

    <!-- Piernas -->
    <rect x="470" y="532" width="32" height="88" rx="8" fill="#1a2b45"/>
    <rect x="522" y="532" width="32" height="88" rx="8" fill="#1a2b45"/>
    <rect x="470" y="612" width="42" height="16" rx="6" fill="#0d1626"/>
    <rect x="522" y="612" width="42" height="16" rx="6" fill="#0d1626"/>
  </g>

  <!-- Brillo -->
  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#bizGlow)"/>
</svg>
