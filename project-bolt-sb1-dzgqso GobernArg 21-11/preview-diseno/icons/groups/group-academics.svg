    <circle cx="104" cy="68" r="12" fill="url(#acaGold)"/>
  </g>

  <!-- Libro abierto -->
  <g transform="translate(640,560)" stroke="#0d1626" stroke-width="5">
    <path d="M-100,0 Q0,-30 0,30 Q0,-30 100,0 L100,14 Q0,-16 0,44 Q0,-16 -100,14 Z" fill="#ffffff"/>
