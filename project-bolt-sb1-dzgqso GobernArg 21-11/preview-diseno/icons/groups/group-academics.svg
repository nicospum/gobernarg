  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#acaShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#acaInner)" stroke="#c29522" stroke-width="10"/>

  <!-- Átomo -->
  <g transform="translate(512,320)" stroke="#0d1626" stroke-width="5">
    <ellipse cx="0" cy="0" rx="130" ry="44" fill="none" stroke="url(#acaGold)" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="130" ry="44" fill="none" stroke="#c29522" stroke-width="8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="130" ry="44" fill="none" stroke="#e0b83e" stroke-width="8" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="16" fill="#c29522"/>
    <circle cx="130" cy="0" r="12" fill="#e0b83e"/>
    <circle cx="-65" cy="-38" r="10" fill="#c29522"/>
    <circle cx="-65" cy="38" r="10" fill="#e0b83e"/>
  </g>

  <!-- Birrete -->
  <g transform="translate(340,560)" stroke="#0d1626" stroke-width="5">
