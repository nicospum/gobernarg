<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="midShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="midInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="1" stop-color="#4a90c9"/>
    </linearGradient>
    <linearGradient id="midGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#midShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#midInner)" stroke="#c29522" stroke-width="10"/>

  <!-- Casa unifamiliar -->
  <g stroke="#0d1626" stroke-width="5">
    <!-- techo -->
    <path d="M310,560 L512,330 L714,560 Z" fill="#c0392b"/>
    <path d="M310,560 L512,330 L512,566 Z" fill="#a93226"/>
    <!-- cuerpo -->
    <rect x="336" y="560" width="352" height="190" fill="#ffffff"/>
    <!-- puerta -->
    <rect x="472" y="620" width="80" height="130" rx="6" fill="#4a90c9"/>
    <circle cx="540" cy="688" r="7" fill="#e0b83e"/>
    <!-- ventanas -->
    <rect x="368" y="600" width="70" height="70" rx="4" fill="#7ab8e0"/>
    <line x1="403" y1="600" x2="403" y2="670" stroke="#1a2b45" stroke-width="4"/>
    <line x1="368" y1="635" x2="438" y2="635" stroke="#1a2b45" stroke-width="4"/>
    <rect x="586" y="600" width="70" height="70" rx="4" fill="#7ab8e0"/>
    <line x1="621" y1="600" x2="621" y2="670" stroke="#1a2b45" stroke-width="4"/>
    <line x1="586" y1="635" x2="656" y2="635" stroke="#1a2b45" stroke-width="4"/>
    <!-- base -->
    <rect x="320" y="750" width="384" height="22" fill="#1a2b45"/>
  </g>

  <!-- Auto modesto -->
  <g transform="translate(400,790)" stroke="#0d1626" stroke-width="5">
    <path d="M0,0 L10,-34 L70,-34 L90,-60 L170,-60 L196,-34 L240,-34 L250,0 Z" fill="#4a90c9"/>
    <rect x="60" y="-52" width="60" height="26" rx="6" fill="#7ab8e0"/>
    <circle cx="70" cy="0" r="26" fill="#1a2b45"/>
    <circle cx="70" cy="0" r="12" fill="#7ab8e0"/>
    <circle cx="190" cy="0" r="26" fill="#1a2b45"/>
    <circle cx="190" cy="0" r="12" fill="#7ab8e0"/>
  </g>

  <!-- Familia -->
  <g stroke="#0d1626" stroke-width="5">
    <!-- adulto -->
    <circle cx="300" cy="560" r="34" fill="#f0cfa8"/>
    <path d="M282,556 Q300,536 318,556 L318,540 Q300,520 282,540 Z" fill="#4a3520"/>
    <path d="M272,592 L328,592 L340,700 L260,700 Z" fill="#1a2b45"/>
    <!-- niño -->
    <circle cx="380" cy="610" r="26" fill="#f0cfa8"/>
    <path d="M366,606 Q380,592 394,606 L394,594 Q380,580 366,594 Z" fill="#4a3520"/>
    <path d="M358,636 L402,636 L410,700 L350,700 Z" fill="#e0b83e"/>
  </g>

  <!-- Sol de Mayo pequeño -->
  <g transform="translate(512,420)">
    <circle r="28" fill="url(#midGold)"/>
    <g fill="#e0b83e">
      <path d="M0,-44 L10,-24 L-10,-24 Z"/>
      <path d="M0,44 L10,24 L-10,24 Z"/>
      <path d="M-44,0 L-24,10 L-24,-10 Z"/>
      <path d="M44,0 L24,10 L24,-10 Z"/>
    </g>
    <circle cx="-8" cy="-4" r="4" fill="#1a2b45"/>
    <circle cx="8" cy="-4" r="4" fill="#1a2b45"/>
    <path d="M-8,7 Q0,13 8,7" fill="none" stroke="#1a2b45" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
