<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="oppShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="oppInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa3b5"/>
      <stop offset="1" stop-color="#5c7085"/>
    </linearGradient>
    <linearGradient id="oppRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e74c3c"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="oppGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#oppShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#oppInner)" stroke="#c29522" stroke-width="10"/>

  <!-- Siluetas en desacuerdo -->
  <g fill="#1a2b45" opacity="0.30">
    <circle cx="300" cy="430" r="30"/>
    <rect x="272" y="460" width="56" height="120" rx="12"/>
    <circle cx="470" cy="410" r="30"/>
    <rect x="442" y="440" width="56" height="140" rx="12"/>
    <circle cx="640" cy="420" r="30"/>
    <rect x="612" y="450" width="56" height="130" rx="12"/>
    <circle cx="740" cy="440" r="28"/>
    <rect x="714" y="468" width="52" height="112" rx="12"/>
  </g>

  <!-- Tribuna opositora -->
  <g stroke="#0d1626" stroke-width="5">
    <rect x="310" y="560" width="404" height="160" rx="12" fill="#1a2b45"/>
    <rect x="290" y="540" width="444" height="40" rx="10" fill="#16304d"/>
    <!-- micrófonos -->
    <g>
      <line x1="360" y1="560" x2="360" y2="500" stroke="#8fa3b5" stroke-width="8"/>
      <circle cx="360" cy="492" r="14" fill="#8fa3b5"/>
      <line x1="440" y1="560" x2="440" y2="490" stroke="#8fa3b5" stroke-width="8"/>
      <circle cx="440" cy="482" r="14" fill="#8fa3b5"/>
      <line x1="600" y1="560" x2="600" y2="500" stroke="#8fa3b5" stroke-width="8"/>
      <circle cx="600" cy="492" r="14" fill="#8fa3b5"/>
    </g>
  </g>

  <!-- Pulgar hacia abajo estilizado -->
  <g transform="translate(512,320)" stroke="#0d1626" stroke-width="6">
    <path d="M-30,-80 L-30,30 Q-30,60 -10,80 L40,110 Q70,120 90,100 L140,40" fill="none" stroke="url(#oppRed)" stroke-width="64" stroke-linecap="round"/>
    <path d="M-30,-80 L-30,30 Q-30,60 -10,80 L40,110 Q70,120 90,100 L140,40" fill="none" stroke="#0d1626" stroke-width="6" stroke-dasharray="0" opacity="0"/>
    <!-- uña -->
    <path d="M120,14 Q140,6 150,20" fill="none" stroke="#e8a89a" stroke-width="8" stroke-linecap="round"/>
    <g fill="none" stroke="#a93226" stroke-width="5" stroke-linecap="round">
      <path d="M-6,-60 Q10,-70 30,-66"/>
      <path d="M-10,-30 Q10,-40 40,-32"/>
    </g>
  </g>

  <!-- señal de desacuerdo -->
  <g stroke="#c0392b" stroke-width="10" stroke-linecap="round">
    <line x1="250" y1="300" x2="290" y2="260"/>
    <line x1="774" y1="300" x2="734" y2="260"/>
  </g>
</svg>
