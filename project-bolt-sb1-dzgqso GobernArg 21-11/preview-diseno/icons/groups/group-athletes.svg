<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="athShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="athInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="1" stop-color="#4a90c9"/>
    </linearGradient>
    <linearGradient id="athGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#athShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#athInner)" stroke="#c29522" stroke-width="10"/>

  <!-- Estadio -->
  <g stroke="#0d1626" stroke-width="5">
    <ellipse cx="512" cy="400" rx="240" ry="80" fill="#ffffff"/>
    <ellipse cx="512" cy="400" rx="240" ry="80" fill="none" stroke="#1a2b45" stroke-width="8"/>
    <ellipse cx="512" cy="400" rx="180" ry="56" fill="#3a7a3f"/>
    <path d="M512,344 L512,456" stroke="#ffffff" stroke-width="6"/>
    <circle cx="512" cy="400" r="26" fill="none" stroke="#ffffff" stroke-width="6"/>
    <ellipse cx="512" cy="336" rx="240" ry="60" fill="none" stroke="#c29522" stroke-width="6"/>
    <g fill="#1a2b45">
      <rect x="300" y="470" width="16" height="50"/>
      <rect x="340" y="470" width="16" height="50"/>
      <rect x="380" y="470" width="16" height="50"/>
      <rect x="420" y="470" width="16" height="50"/>
      <rect x="460" y="470" width="16" height="50"/>
      <rect x="500" y="470" width="16" height="50"/>
      <rect x="540" y="470" width="16" height="50"/>
      <rect x="580" y="470" width="16" height="50"/>
      <rect x="620" y="470" width="16" height="50"/>
      <rect x="660" y="470" width="16" height="50"/>
      <rect x="700" y="470" width="16" height="50"/>
    </g>
  </g>

  <!-- Pelota -->
  <g transform="translate(512,640)" stroke="#0d1626" stroke-width="5">
    <circle r="60" fill="#ffffff"/>
    <path d="M0,-60 L0,60 M-60,0 L60,0 M-42,-42 L42,42 M-42,42 L42,-42" stroke="#1a2b45" stroke-width="5"/>
    <path d="M-30,-60 L-60,-30 L-30,0 L0,-30 Z" fill="#1a2b45"/>
    <path d="M30,60 L60,30 L30,0 L0,30 Z" fill="#1a2b45"/>
  </g>

  <!-- Medalla -->
  <g transform="translate(300,520)" stroke="#0d1626" stroke-width="5">
    <circle r="46" fill="url(#athGold)"/>
    <circle r="30" fill="none" stroke="#c29522" stroke-width="5"/>
    <path d="M-16,-10 L16,-10" stroke="#1a2b45" stroke-width="4"/>
    <rect x="-10" y="-90" width="20" height="46" fill="#c0392b"/>
    <rect x="-10" y="-44" width="20" height="44" fill="#4a90c9"/>
  </g>

  <!-- Antorcha -->
  <g transform="translate(724,520)" stroke="#0d1626" stroke-width="5">
    <path d="M0,60 L0,-20" stroke="#c29522" stroke-width="16" stroke-linecap="round"/>
    <path d="M-16,-20 Q0,-60 16,-20 Z" fill="url(#athGold)"/>
    <g fill="#e07a3f">
      <path d="M0,-30 Q-16,-50 0,-70 Q16,-50 0,-30 Z"/>
      <path d="M-8,-40 Q0,-58 0,-66 Q0,-58 8,-40 Z" fill="#f2b84b"/>
    </g>
