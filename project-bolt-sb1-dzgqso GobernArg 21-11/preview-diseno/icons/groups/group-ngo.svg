<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ngoShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="ngoInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="1" stop-color="#4a90c9"/>
    </linearGradient>
    <linearGradient id="ngoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#ngoShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#ngoInner)" stroke="#c29522" stroke-width="10"/>

  <!-- Ramas de laurel -->
  <g fill="#c29522" stroke="#0d1626" stroke-width="3">
    <g transform="translate(260,760)">
      <path d="M0,0 Q-70,-140 -40,-300" fill="none" stroke="#c29522" stroke-width="10"/>
      <ellipse cx="-34" cy="-80" rx="24" ry="11" transform="rotate(-28 -34 -80)"/>
      <ellipse cx="-56" cy="-160" rx="24" ry="11" transform="rotate(-18 -56 -160)"/>
      <ellipse cx="-50" cy="-240" rx="22" ry="10" transform="rotate(-8 -50 -240)"/>
      <ellipse cx="-12" cy="-60" rx="24" ry="11" transform="rotate(24 -12 -60)"/>
      <ellipse cx="-32" cy="-140" rx="24" ry="11" transform="rotate(30 -32 -140)"/>
    </g>
    <g transform="translate(764,760) scale(-1,1)">
      <path d="M0,0 Q-70,-140 -40,-300" fill="none" stroke="#c29522" stroke-width="10"/>
      <ellipse cx="-34" cy="-80" rx="24" ry="11" transform="rotate(-28 -34 -80)"/>
      <ellipse cx="-56" cy="-160" rx="24" ry="11" transform="rotate(-18 -56 -160)"/>
      <ellipse cx="-50" cy="-240" rx="22" ry="10" transform="rotate(-8 -50 -240)"/>
      <ellipse cx="-12" cy="-60" rx="24" ry="11" transform="rotate(24 -12 -60)"/>
      <ellipse cx="-32" cy="-140" rx="24" ry="11" transform="rotate(30 -32 -140)"/>
    </g>
  </g>

  <!-- Manos entrelazadas formando corazón -->
  <g stroke="#0d1626" stroke-width="5">
    <!-- brazos que forman corazón -->
    <path d="M270,420 Q360,300 512,420 Q664,300 754,420 Q780,470 740,520 L512,720 L284,520 Q244,470 270,420 Z" fill="#f0cfa8"/>
    <path d="M270,420 Q360,300 512,420 Q664,300 754,420 Q780,470 740,520 L512,720 L284,520 Q244,470 270,420 Z" fill="none" stroke="#0d1626" stroke-width="6"/>
    <!-- pliegues -->
    <path d="M340,480 Q370,520 400,540" fill="none" stroke="#c98d5f" stroke-width="5"/>
    <path d="M684,480 Q654,520 624,540" fill="none" stroke="#c98d5f" stroke-width="5"/>
    <!-- símbolo de comunidad (círculo de personas) -->
    <g transform="translate(512,560)">
      <circle cx="0" cy="-18" r="14" fill="#f0cfa8"/>
      <circle cx="-24" cy="14" r="14" fill="#f0cfa8"/>
      <circle cx="24" cy="14" r="14" fill="#f0cfa8"/>
      <path d="M-16,-4 Q0,14 16,-4" fill="none" stroke="#1a2b45" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#c29522"/>
    </g>
  </g>

  <!-- Sol de Mayo -->
  <g transform="translate(512,320)">
    <circle r="44" fill="url(#ngoGold)" stroke="#0d1626" stroke-width="3"/>
    <g fill="#e0b83e">
      <path d="M0,-66 L14,-30 L-14,-30 Z"/>
      <path d="M0,66 L14,30 L-14,30 Z"/>
      <path d="M-66,0 L-30,14 L-30,-14 Z"/>
      <path d="M66,0 L30,14 L30,-14 Z"/>
    </g>
    <circle cx="-12" cy="-6" r="6" fill="#1a2b45"/>
    <circle cx="12" cy="-6" r="6" fill="#1a2b45"/>
    <path d="M-12,12 Q0,20 12,12" fill="none" stroke="#1a2b45" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
