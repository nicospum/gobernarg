<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="uppShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="uppGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
    <linearGradient id="uppSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="1" stop-color="#4a90c9"/>
    </linearGradient>
  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#uppShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#uppSky)" stroke="#c29522" stroke-width="10"/>

  <!-- Torre de lujo -->
  <g stroke="#0d1626" stroke-width="5">
    <rect x="340" y="300" width="344" height="340" fill="#16304d"/>
    <rect x="340" y="300" width="344" height="20" fill="#0d1626"/>
    <!-- antena -->
    <line x1="512" y1="300" x2="512" y2="200" stroke="#c29522" stroke-width="10"/>
    <circle cx="512" cy="196" r="10" fill="#e0b83e"/>
    <!-- ventanas -->
    <g fill="#7ab8e0">
      <rect x="360" y="340" width="40" height="40"/>
      <rect x="420" y="340" width="40" height="40"/>
      <rect x="480" y="340" width="40" height="40"/>
      <rect x="540" y="340" width="40" height="40"/>
      <rect x="360" y="410" width="40" height="40"/>
      <rect x="420" y="410" width="40" height="40"/>
      <rect x="480" y="410" width="40" height="40"/>
      <rect x="540" y="410" width="40" height="40"/>
      <rect x="360" y="480" width="40" height="40"/>
      <rect x="420" y="480" width="40" height="40"/>
      <rect x="480" y="480" width="40" height="40"/>
      <rect x="540" y="480" width="40" height="40"/>
      <rect x="360" y="550" width="40" height="40"/>
      <rect x="420" y="550" width="40" height="40"/>
      <rect x="480" y="550" width="40" height="40"/>
      <rect x="540" y="550" width="40" height="40"/>
    </g>
    <!-- entrada -->
    <path d="M470,640 L470,590 Q512,566 554,590 L554,640 Z" fill="url(#uppGold)"/>
    <!-- cornisa -->
    <rect x="330" y="640" width="364" height="18" fill="#c29522"/>
  </g>

  <!-- Auto de alta gama -->
  <g transform="translate(512,780)" stroke="#0d1626" stroke-width="5">
    <path d="M-130,10 Q-150,-10 -120,-30 L-40,-30 L-10,-60 L90,-60 L130,-30 L180,-30 Q210,-30 220,-10 L220,10 Z" fill="url(#uppGold)"/>
    <path d="M-60,-30 L20,-30 L40,-52 L80,-52 L100,-30 L130,-30" fill="none" stroke="#1a2b45" stroke-width="6"/>
    <circle cx="-60" cy="12" r="26" fill="#1a2b45"/>
    <circle cx="-60" cy="12" r="12" fill="#c29522"/>
    <circle cx="140" cy="12" r="26" fill="#1a2b45"/>
    <circle cx="140" cy="12" r="12" fill="#c29522"/>
    <path d="M170,6 L170,18" stroke="#e0b83e" stroke-width="5"/>
  </g>

  <!-- Escudo exclusivo -->
  <g transform="translate(512,400)" stroke="#0d1626" stroke-width="5">
    <path d="M0,-60 L60,-40 L60,20 Q60,50 0,70 Q-60,50 -60,20 L-60,-40 Z" fill="url(#uppGold)"/>
    <path d="M0,-44 L44,-28 L44,16 Q44,40 0,56 Q-44,40 -44,16 L-44,-28 Z" fill="#16304d"/>
    <circle r="16" fill="#e0b83e"/>
    <path d="M-30,44 L0,20 L30,44" fill="none" stroke="#e0b83e" stroke-width="4"/>
  </g>
</svg>
