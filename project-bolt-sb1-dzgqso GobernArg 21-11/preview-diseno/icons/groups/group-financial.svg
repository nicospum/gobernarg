<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="finShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="finInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="1" stop-color="#4a90c9"/>
    </linearGradient>
    <linearGradient id="finGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
    <radialGradient id="finSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e6a8"/>
      <stop offset="1" stop-color="#e0b83e"/>
    </radialGradient>
  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#finShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#finInner)" stroke="#c29522" stroke-width="10"/>

  <!-- Edificio bancario -->
  <g stroke="#0d1626" stroke-width="5">
    <!-- frontón triangular -->
    <path d="M362,300 L512,190 L662,300 Z" fill="#1a2b45"/>
    <!-- Sol de Mayo en frontón -->
    <g transform="translate(512,250)">
      <circle r="26" fill="url(#finSun)"/>
      <g fill="#e0b83e">
        <path d="M0,-44 L9,-26 L-9,-26 Z"/>
        <path d="M0,44 L9,26 L-9,26 Z"/>
        <path d="M-44,0 L-26,9 L-26,-9 Z"/>
        <path d="M44,0 L26,9 L26,-9 Z"/>
      </g>
      <circle cx="-8" cy="-4" r="4" fill="#1a2b45"/>
      <circle cx="8" cy="-4" r="4" fill="#1a2b45"/>
    </g>
    <!-- cuerpo -->
    <rect x="372" y="300" width="280" height="240" fill="#e8edf2"/>
    <!-- columnas -->
    <g fill="url(#finGold)">
      <rect x="392" y="320" width="40" height="200" rx="4"/>
      <rect x="492" y="320" width="40" height="200" rx="4"/>
      <rect x="592" y="320" width="40" height="200" rx="4"/>
    </g>
    <rect x="372" y="540" width="280" height="20" fill="#1a2b45"/>
    <!-- puerta -->
    <path d="M486,540 L486,470 Q512,446 538,470 L538,540 Z" fill="#1a2b45"/>
    <!-- escalones -->
    <rect x="462" y="560" width="100" height="16" rx="4" fill="#1a2b45"/>
    <rect x="442" y="576" width="140" height="16" rx="4" fill="#1a2b45"/>
  </g>

  <!-- Billete -->
  <g transform="translate(512,660) rotate(-6)" stroke="#0d1626" stroke-width="5">
    <rect x="-120" y="-56" width="240" height="112" rx="10" fill="#ffffff"/>
    <rect x="-108" y="-44" width="216" height="88" rx="6" fill="#f2f7fb" stroke="#7ab8e0" stroke-width="3"/>
    <circle cx="-70" cy="0" r="20" fill="#7ab8e0" opacity="0.6"/>
    <text x="10" y="12" font-family="Georgia, serif" font-size="26" fill="#1a2b45" text-anchor="middle" font-weight="bold">$100</text>
    <path d="M70,-20 Q90,0 70,20" fill="none" stroke="#c29522" stroke-width="4"/>
  </g>

  <!-- Gráfico de velas ascendente -->
  <g transform="translate(512,760)" stroke="#0d1626" stroke-width="4">
    <g>
      <rect x="-140" y="-40" width="14" height="70" fill="#c29522"/>
      <line x1="-133" y1="-70" x2="-133" y2="40" stroke="#c29522" stroke-width="4"/>
      <rect x="-100" y="-60" width="14" height="90" fill="#c29522"/>
      <line x1="-93" y1="-90" x2="-93" y2="40" stroke="#c29522" stroke-width="4"/>
      <rect x="-60" y="-20" width="14" height="50" fill="#c29522"/>
      <line x1="-53" y1="-40" x2="-53" y2="40" stroke="#c29522" stroke-width="4"/>
      <rect x="-20" y="-80" width="14" height="110" fill="#e0b83e"/>
      <line x1="-13" y1="-110" x2="-13" y2="40" stroke="#e0b83e" stroke-width="4"/>
      <rect x="20" y="-50" width="14" height="80" fill="#e0b83e"/>
      <line x1="27" y1="-80" x2="27" y2="40" stroke="#e0b83e" stroke-width="4"/>
      <rect x="60" y="-90" width="14" height="120" fill="#e0b83e"/>
      <line x1="67" y1="-120" x2="67" y2="40" stroke="#e0b83e" stroke-width="4"/>
      <rect x="100" y="-30" width="14" height="60" fill="#c29522"/>
      <line x1="107" y1="-55" x2="107" y2="40" stroke="#c29522" stroke-width="4"/>
    </g>
  </g>
</svg>
