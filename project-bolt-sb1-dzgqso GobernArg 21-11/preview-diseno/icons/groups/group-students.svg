<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="stuShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="stuInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="1" stop-color="#4a90c9"/>
    </linearGradient>
    <linearGradient id="stuGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
  </defs>

  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#stuShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#stuInner)" stroke="#c29522" stroke-width="10"/>

  <!-- Birrete de graduación -->
  <g transform="translate(512,360)" stroke="#0d1626" stroke-width="5">
    <path d="M-120,0 L0,-70 L120,0 Z" fill="#1a2b45"/>
    <path d="M-120,0 L0,-70 L120,0 L100,14 L0,-50 L-100,14 Z" fill="#16304d"/>
    <!-- borla -->
    <path d="M120,0 Q150,20 140,80" fill="none" stroke="#c29522" stroke-width="8"/>
    <circle cx="140" cy="88" r="14" fill="url(#stuGold)"/>
    <path d="M0,-70 L0,-30" stroke="#1a2b45" stroke-width="8"/>
    <circle cx="0" cy="-24" r="12" fill="url(#stuGold)"/>
  </g>

  <!-- Libro abierto -->
  <g transform="translate(512,600)" stroke="#0d1626" stroke-width="5">
    <path d="M-140,0 Q0,-40 0,40 Q0,-40 140,0 L140,20 Q0,-20 0,60 Q0,-20 -140,20 Z" fill="#ffffff"/>
    <path d="M0,-40 L0,60" stroke="#c29522" stroke-width="6"/>
    <path d="M-100,-8 Q-60,-22 -20,-12" fill="none" stroke="#4a90c9" stroke-width="5" stroke-linecap="round"/>
    <path d="M-100,6 Q-60,-8 -20,2" fill="none" stroke="#7ab8e0" stroke-width="5" stroke-linecap="round"/>
    <path d="M20,-12 Q60,-22 100,-8" fill="none" stroke="#4a90c9" stroke-width="5" stroke-linecap="round"/>
    <path d="M20,2 Q60,-8 100,6" fill="none" stroke="#7ab8e0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Banderín estudiantil -->
  <g transform="translate(512,760)" stroke="#0d1626" stroke-width="5">
    <line x1="0" y1="-60" x2="0" y2="70" stroke="#1a2b45" stroke-width="12"/>
    <path d="M0,-56 L90,-30 L0,-4 Z" fill="#e0b83e"/>
    <path d="M0,-30 L60,-22 L0,-14 Z" fill="#4a90c9"/>
  </g>

  <!-- Lápiz -->
  <g transform="translate(300,480) rotate(-35)" stroke="#0d1626" stroke-width="5">
    <rect x="-14" y="-90" width="28" height="120" fill="#e0b83e"/>
    <rect x="-14" y="-90" width="28" height="30" fill="#c29522"/>
    <path d="M-14,-90 L0,-140 L14,-90 Z" fill="#f0cfa8"/>
    <path d="M-6,-140 L6,-140 L10,-90 L-10,-90 Z" fill="#1a2b45"/>
    <path d="M-10,-128 L10,-128" stroke="#1a2b45" stroke-width="3"/>
    <path d="M-14,30 L0,60 L14,30 Z" fill="#f0cfa8"/>
  </g>
</svg>
