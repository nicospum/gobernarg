<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="indShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#1a2b45"/>
    </linearGradient>
    <linearGradient id="indSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c88a"/>
      <stop offset="1" stop-color="#d9a95c"/>
    </linearGradient>
    <linearGradient id="indGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
