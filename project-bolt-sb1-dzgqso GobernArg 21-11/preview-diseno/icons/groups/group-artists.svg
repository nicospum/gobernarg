  <polygon points="512,118 868,320 868,566 512,906 156,566 156,320" fill="url(#artShield)" stroke="#0d1626" stroke-width="20"/>
  <polygon points="512,156 834,340 834,544 512,866 190,544 190,340" fill="url(#artInner)" stroke="#c29522" stroke-width="10"/>

