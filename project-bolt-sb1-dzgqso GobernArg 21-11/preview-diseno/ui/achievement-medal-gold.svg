<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="amgGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
    <radialGradient id="amgDisc" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f7e6a8"/>
      <stop offset="0.5" stop-color="#e0b83e"/>
      <stop offset="1" stop-color="#a87e1c"/>
    </radialGradient>
    <radialGradient id="amgSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e6a8"/>
      <stop offset="1" stop-color="#e0b83e"/>
    </radialGradient>
    <filter id="amgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0d1626" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Colas de cinta (detrás del disco) -->
  <g stroke="#0d1626" stroke-width="4">
    <path d="M198,160 L150,360 L206,368 L234,200 Z" fill="#4a90c9"/>
    <path d="M314,160 L362,360 L306,368 L278,200 Z" fill="#4a90c9"/>
  </g>

  <!-- Cinta superior -->
  <g stroke="#0d1626" stroke-width="4">
    <path d="M196,14 L316,14 L316,168 L196,168 Z" fill="#4a90c9"/>
    <path d="M246,14 L266,14 L266,168 L246,168 Z" fill="#ffffff"/>
    <path d="M186,160 L326,160 L300,196 L212,196 Z" fill="#3a78b5"/>
  </g>

  <!-- Disco dorado -->
  <g filter="url(#amgShadow)">
    <circle cx="256" cy="310" r="150" fill="url(#amgDisc)" stroke="#0d1626" stroke-width="8"/>
    <circle cx="256" cy="310" r="128" fill="none" stroke="#c29522" stroke-width="6"/>
    <circle cx="256" cy="310" r="112" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Sol de Mayo central -->
  <g transform="translate(256,310)">
    <g fill="#e0b83e" stroke="#1a2b45" stroke-width="3">
      <path d="M0,-70 L14,-32 L-14,-32 Z"/>
      <path d="M0,70 L14,32 L-14,32 Z"/>
      <path d="M-70,0 L-32,14 L-32,-14 Z"/>
      <path d="M70,0 L32,14 L32,-14 Z"/>
      <path d="M-49,-49 L-22,-22 L-36,-22 Z"/>
      <path d="M49,-49 L22,-22 L36,-22 Z"/>
      <path d="M-49,49 L-22,22 L-36,22 Z"/>
      <path d="M49,49 L22,22 L36,22 Z"/>
    </g>
    <circle r="36" fill="url(#amgSun)" stroke="#1a2b45" stroke-width="3"/>
    <circle cx="-10" cy="-6" r="6" fill="#1a2b45"/>
    <circle cx="10" cy="-6" r="6" fill="#1a2b45"/>
    <path d="M-9,9 Q0,18 9,9" fill="none" stroke="#1a2b45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Laureles en la base del disco -->
  <g fill="#1a2b45" stroke="#c29522" stroke-width="3">
    <g transform="translate(150,340) rotate(30)">
      <path d="M0,0 Q20,50 60,70" fill="none" stroke="#c29522" stroke-width="6"/>
      <ellipse cx="24" cy="22" rx="18" ry="8" transform="rotate(20 24 22)"/>
      <ellipse cx="48" cy="46" rx="18" ry="8" transform="rotate(10 48 46)"/>
      <ellipse cx="10" cy="34" rx="18" ry="8" transform="rotate(40 10 34)"/>
    </g>
    <g transform="translate(362,340) rotate(-30)">
      <path d="M0,0 Q-20,50 -60,70" fill="none" stroke="#c29522" stroke-width="6"/>
      <ellipse cx="-24" cy="22" rx="18" ry="8" transform="rotate(-20 -24 22)"/>
      <ellipse cx="-48" cy="46" rx="18" ry="8" transform="rotate(-10 -48 46)"/>
      <ellipse cx="-10" cy="34" rx="18" ry="8" transform="rotate(-40 -10 34)"/>
    </g>
  </g>
</svg>
