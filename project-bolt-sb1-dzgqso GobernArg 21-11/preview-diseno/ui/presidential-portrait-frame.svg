<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ppfGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="0.5" stop-color="#e0b83e"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
    <linearGradient id="ppfGold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e6a8"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
    <linearGradient id="ppfCeleste" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="1" stop-color="#4a90c9"/>
    </linearGradient>
    <radialGradient id="ppfSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e6a8"/>
      <stop offset="1" stop-color="#e0b83e"/>
    </radialGradient>
    <filter id="ppfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d1626" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sombra general -->
  <g filter="url(#ppfShadow)">
    <!-- Marco ovalado principal (centro transparente vía evenodd) -->
    <path fill-rule="evenodd" fill="url(#ppfGold)"
      d="M512,72 A360,440 0 0 1 872,512 A360,440 0 0 1 512,952 A360,440 0 0 1 152,512 A360,440 0 0 1 512,72 Z
         M512,132 A300,380 0 0 1 812,512 A300,380 0 0 1 512,892 A300,380 0 0 1 212,512 A300,380 0 0 1 512,132 Z"/>
  </g>

  <!-- Anillo decorativo interior (borde del centro transparente) -->
  <path d="M512,120 A308,388 0 0 1 820,512 A308,388 0 0 1 512,904 A308,388 0 0 1 204,512 A308,388 0 0 1 512,120 Z" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.85"/>
  <path d="M512,148 A292,372 0 0 1 804,512 A292,372 0 0 1 512,876 A292,372 0 0 1 220,512 A292,372 0 0 1 512,148 Z" fill="none" stroke="#c29522" stroke-width="6"/>

  <!-- Moldura exterior -->
  <path d="M512,56 A380,460 0 0 1 892,512 A380,460 0 0 1 512,968 A380,460 0 0 1 132,512 A380,460 0 0 1 512,56 Z" fill="none" stroke="#1a2b45" stroke-width="12"/>
  <path d="M512,56 A380,460 0 0 1 892,512 A380,460 0 0 1 512,968 A380,460 0 0 1 132,512 A380,460 0 0 1 512,56 Z" fill="none" stroke="url(#ppfGold2)" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Laureles laterales -->
  <g fill="#1a2b45" stroke="#c29522" stroke-width="3">
    <g transform="translate(140,512) rotate(-70)">
      <path d="M0,0 Q10,-120 0,-260" fill="none" stroke="#c29522" stroke-width="10"/>
      <ellipse cx="22" cy="-50" rx="26" ry="12" transform="rotate(-28 22 -50)"/>
      <ellipse cx="30" cy="-120" rx="26" ry="12" transform="rotate(-16 30 -120)"/>
      <ellipse cx="24" cy="-190" rx="24" ry="11" transform="rotate(-6 24 -190)"/>
      <ellipse cx="2" cy="-34" rx="26" ry="12" transform="rotate(24 2 -34)"/>
      <ellipse cx="10" cy="-104" rx="26" ry="12" transform="rotate(28 10 -104)"/>
      <ellipse cx="6" cy="-174" rx="24" ry="11" transform="rotate(30 6 -174)"/>
    </g>
    <g transform="translate(884,512) rotate(70)">
      <path d="M0,0 Q10,-120 0,-260" fill="none" stroke="#c29522" stroke-width="10"/>
      <ellipse cx="22" cy="-50" rx="26" ry="12" transform="rotate(-28 22 -50)"/>
      <ellipse cx="30" cy="-120" rx="26" ry="12" transform="rotate(-16 30 -120)"/>
      <ellipse cx="24" cy="-190" rx="24" ry="11" transform="rotate(-6 24 -190)"/>
      <ellipse cx="2" cy="-34" rx="26" ry="12" transform="rotate(24 2 -34)"/>
      <ellipse cx="10" cy="-104" rx="26" ry="12" transform="rotate(28 10 -104)"/>
      <ellipse cx="6" cy="-174" rx="24" ry="11" transform="rotate(30 6 -174)"/>
    </g>
  </g>

  <!-- Sol de Mayo arriba -->
  <g transform="translate(512,86)">
    <g fill="#e0b83e" stroke="#1a2b45" stroke-width="4">
      <path d="M0,-66 L14,-28 L-14,-28 Z"/>
      <path d="M0,66 L14,28 L-14,28 Z"/>
      <path d="M-66,0 L-28,14 L-28,-14 Z"/>
      <path d="M66,0 L28,14 L28,-14 Z"/>
      <path d="M-47,-47 L-20,-20 L-40,-20 Z"/>
      <path d="M47,-47 L20,-20 L40,-20 Z"/>
      <path d="M-47,47 L-20,20 L-40,20 Z"/>
      <path d="M47,47 L20,20 L40,20 Z"/>
    </g>
    <circle r="34" fill="url(#ppfSun)" stroke="#1a2b45" stroke-width="4"/>
    <circle cx="-10" cy="-6" r="5" fill="#1a2b45"/>
    <circle cx="10" cy="-6" r="5" fill="#1a2b45"/>
    <path d="M-9,8 Q0,16 9,8" fill="none" stroke="#1a2b45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Cintas celeste/blanca en la base -->
  <g transform="translate(512,928)">
    <path d="M-170,0 Q-150,44 -110,64 L0,70 L110,64 Q150,44 170,0 L120,-6 L0,-2 L-120,-6 Z" fill="url(#ppfCeleste)" stroke="#1a2b45" stroke-width="6"/>
    <path d="M-150,6 Q-136,40 -104,52 L0,58 L104,52 Q136,40 150,6 L0,2 Z" fill="#ffffff"/>
    <path d="M-60,10 L60,10 L60,26 L-60,26 Z" fill="url(#ppfCeleste)" stroke="#c29522" stroke-width="4"/>
    <circle cx="0" cy="18" r="10" fill="url(#ppfSun)" stroke="#1a2b45" stroke-width="3"/>
  </g>

  <!-- Rosetas en esquinas superiores -->
  <g fill="url(#ppfGold2)" stroke="#1a2b45" stroke-width="4">
    <circle cx="196" cy="150" r="20"/>
    <circle cx="828" cy="150" r="20"/>
  </g>
</svg>
