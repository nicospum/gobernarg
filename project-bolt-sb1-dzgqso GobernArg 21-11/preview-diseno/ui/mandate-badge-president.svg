<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mbpGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
    <linearGradient id="mbpNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4e7a"/>
      <stop offset="1" stop-color="#0d1626"/>
    </linearGradient>
    <radialGradient id="mbpSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e6a8"/>
      <stop offset="1" stop-color="#e0b83e"/>
    </radialGradient>
    <clipPath id="mbpClip">
      <path d="M256,36 L428,104 L428,344 Q428,448 256,484 Q84,448 84,344 L84,104 Z"/>
    </clipPath>
  </defs>

  <!-- Escudo exterior -->
  <path d="M256,36 L428,104 L428,344 Q428,448 256,484 Q84,448 84,344 L84,104 Z" fill="url(#mbpGold)" stroke="#0d1626" stroke-width="10"/>
  <path d="M256,56 L408,118 L408,338 Q408,436 256,468 Q104,436 104,338 L104,118 Z" fill="url(#mbpNavy)" stroke="#c29522" stroke-width="6"/>

  <!-- Banda presidencial celeste-blanca (diagonal) -->
  <g clip-path="url(#mbpClip)">
    <rect x="-60" y="120" width="640" height="150" fill="#4a90c9" transform="rotate(-32 256 256)"/>
    <rect x="-60" y="182" width="640" height="26" fill="#ffffff" transform="rotate(-32 256 256)"/>
  </g>

  <!-- Sol de Mayo -->
  <g transform="translate(256,250)">
    <g fill="#e0b83e" stroke="#1a2b45" stroke-width="4">
      <path d="M0,-92 L18,-40 L-18,-40 Z"/>
      <path d="M0,92 L18,40 L-18,40 Z"/>
      <path d="M-92,0 L-40,18 L-40,-18 Z"/>
      <path d="M92,0 L40,18 L40,-18 Z"/>
      <path d="M-65,-65 L-28,-28 L-50,-28 Z"/>
      <path d="M65,-65 L28,-28 L50,-28 Z"/>
      <path d="M-65,65 L-28,28 L-50,28 Z"/>
      <path d="M65,65 L28,28 L50,28 Z"/>
    </g>
    <circle r="46" fill="url(#mbpSun)" stroke="#1a2b45" stroke-width="4"/>
    <circle cx="-13" cy="-8" r="7" fill="#1a2b45"/>
    <circle cx="13" cy="-8" r="7" fill="#1a2b45"/>
    <path d="M-12,12 Q0,24 12,12" fill="none" stroke="#1a2b45" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Laureles laterales -->
  <g fill="#1a2b45" stroke="#c29522" stroke-width="3">
    <g transform="translate(120,330) rotate(-40)">
      <path d="M0,0 Q10,-70 0,-150" fill="none" stroke="#c29522" stroke-width="8"/>
      <ellipse cx="20" cy="-34" rx="22" ry="10" transform="rotate(-26 20 -34)"/>
      <ellipse cx="24" cy="-84" rx="22" ry="10" transform="rotate(-14 24 -84)"/>
      <ellipse cx="16" cy="-130" rx="20" ry="9" transform="rotate(-6 16 -130)"/>
      <ellipse cx="2" cy="-26" rx="22" ry="10" transform="rotate(26 2 -26)"/>
      <ellipse cx="6" cy="-76" rx="22" ry="10" transform="rotate(30 6 -76)"/>
    </g>
    <g transform="translate(392,330) rotate(40)">
      <path d="M0,0 Q10,-70 0,-150" fill="none" stroke="#c29522" stroke-width="8"/>
      <ellipse cx="20" cy="-34" rx="22" ry="10" transform="rotate(-26 20 -34)"/>
      <ellipse cx="24" cy="-84" rx="22" ry="10" transform="rotate(-14 24 -84)"/>
      <ellipse cx="16" cy="-130" rx="20" ry="9" transform="rotate(-6 16 -130)"/>
      <ellipse cx="2" cy="-26" rx="22" ry="10" transform="rotate(26 2 -26)"/>
      <ellipse cx="6" cy="-76" rx="22" ry="10" transform="rotate(30 6 -76)"/>
    </g>
  </g>

  <!-- Estrella superior -->
  <g transform="translate(256,80)">
    <path d="M0,-22 L6,-6 L22,-6 L9,4 L13,20 L0,11 L-13,20 L-9,4 L-22,-6 L-6,-6 Z" fill="url(#mbpGold)" stroke="#1a2b45" stroke-width="3"/>
  </g>
</svg>
