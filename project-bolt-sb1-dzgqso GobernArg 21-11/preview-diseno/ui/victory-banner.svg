<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 480">
  <defs>
    <linearGradient id="vicBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab8e0"/>
      <stop offset="0.5" stop-color="#4a90c9"/>
      <stop offset="1" stop-color="#2f6f9f"/>
    </linearGradient>
    <linearGradient id="vicGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4db82"/>
      <stop offset="1" stop-color="#c29522"/>
    </linearGradient>
    <radialGradient id="vicSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e6a8"/>
      <stop offset="1" stop-color="#e0b83e"/>
    </radialGradient>
    <filter id="vicShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0d1626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cinta principal -->
  <rect x="40" y="80" width="1840" height="320" rx="24" fill="url(#vicBg)" stroke="#0d1626" stroke-width="12" filter="url(#vicShadow)"/>

  <!-- Doble borde dorado -->
  <rect x="62" y="102" width="1796" height="276" rx="16" fill="none" stroke="url(#vicGold)" stroke-width="10"/>
  <rect x="78" y="118" width="1764" height="244" rx="10" fill="none" stroke="#c29522" stroke-width="3"/>

  <!-- Destellos radiantes de fondo -->
  <g fill="#ffffff" opacity="0.12">
    <path d="M480,240 L900,180 L900,300 Z"/>
    <path d="M480,240 L860,120 L860,360 Z" opacity="0.7"/>
  </g>

  <!-- Sol de Mayo radiante (izquierda) -->
  <g transform="translate(420,240)">
    <g fill="#e0b83e" stroke="#1a2b45" stroke-width="5">
      <path d="M0,-130 L22,-52 L-22,-52 Z"/>
      <path d="M0,130 L22,52 L-22,52 Z"/>
      <path d="M-130,0 L-52,22 L-52,-22 Z"/>
      <path d="M130,0 L52,22 L52,-22 Z"/>
      <path d="M-92,-92 L-40,-40 L-72,-40 Z"/>
      <path d="M92,-92 L40,-40 L72,-40 Z"/>
      <path d="M-92,92 L-40,40 L-72,40 Z"/>
      <path d="M92,92 L40,40 L72,40 Z"/>
    </g>
    <circle r="64" fill="url(#vicSun)" stroke="#1a2b45" stroke-width="6"/>
    <circle cx="-20" cy="-12" r="10" fill="#1a2b45"/>
    <circle cx="20" cy="-12" r="10" fill="#1a2b45"/>
    <path d="M-18,14 Q0,28 18,14" fill="none" stroke="#1a2b45" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Laureles izquierda -->
  <g fill="#1a2b45" stroke="#c29522" stroke-width="4">
    <g transform="translate(120,470) rotate(20)">
      <path d="M0,0 Q-60,-140 10,-320" fill="none" stroke="#c29522" stroke-width="12"/>
      <ellipse cx="-30" cy="-70" rx="30" ry="13" transform="rotate(-24 -30 -70)"/>
      <ellipse cx="-44" cy="-150" rx="30" ry="13" transform="rotate(-14 -44 -150)"/>
      <ellipse cx="-30" cy="-230" rx="28" ry="12" transform="rotate(-6 -30 -230)"/>
      <ellipse cx="-10" cy="-50" rx="30" ry="13" transform="rotate(26 -10 -50)"/>
      <ellipse cx="-18" cy="-130" rx="30" ry="13" transform="rotate(30 -18 -130)"/>
      <ellipse cx="-12" cy="-210" rx="28" ry="12" transform="rotate(28 -12 -210)"/>
    </g>
  </g>

  <!-- Laureles derecha -->
  <g fill="#1a2b45" stroke="#c29522" stroke-width="4">
    <g transform="translate(1800,470) rotate(-20)">
      <path d="M0,0 Q60,-140 -10,-320" fill="none" stroke="#c29522" stroke-width="12"/>
      <ellipse cx="30" cy="-70" rx="30" ry="13" transform="rotate(24 30 -70)"/>
      <ellipse cx="44" cy="-150" rx="30" ry="13" transform="rotate(14 44 -150)"/>
      <ellipse cx="30" cy="-230" rx="28" ry="12" transform="rotate(6 30 -230)"/>
      <ellipse cx="10" cy="-50" rx="30" ry="13" transform="rotate(-26 10 -50)"/>
      <ellipse cx="18" cy="-130" rx="30" ry="13" transform="rotate(-30 18 -130)"/>
      <ellipse cx="12" cy="-210" rx="28" ry="12" transform="rotate(-28 12 -210)"/>
    </g>
  </g>

  <!-- Espacio central vacío para texto "¡Victoria!" -->
  <!-- (se deja deliberadamente en blanco) -->

  <!-- Rosetas decorativas -->
  <g fill="url(#vicGold)" stroke="#1a2b45" stroke-width="4">
    <circle cx="100" cy="140" r="18"/>
    <circle cx="1820" cy="140" r="18"/>
    <circle cx="100" cy="340" r="18"/>
    <circle cx="1820" cy="340" r="18"/>
  </g>

  <!-- Cinta celeste/blanca inferior -->
  <g transform="translate(960,430)">
    <path d="M-360,0 Q-330,26 -240,30 L240,30 Q330,26 360,0 L330,-8 L0,-2 L-330,-8 Z" fill="url(#vicGold)" stroke="#0d1626" stroke-width="6"/>
    <path d="M-330,-2 Q-300,20 -220,22 L220,22 Q300,20 330,-2 L0,-8 Z" fill="#ffffff"/>
    <path d="M-160,-4 L160,-4 L160,8 L-160,8 Z" fill="url(#vicBg)" stroke="#c29522" stroke-width="3"/>
  </g>
</svg>
