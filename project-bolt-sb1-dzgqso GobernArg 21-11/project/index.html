<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Versión de prueba: no indexar en buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>GobernArg Lite</title>
    <!-- Vista previa al compartir el link (Fase 4). VITE_SITE_URL la completa Netlify al compilar. -->
    <meta name="description" content="GobernArg Lite, la versión compacta: gobernás la Argentina, negociás con empresas, sindicatos y gobernadores, y buscás la reelección." />
    <meta name="theme-color" content="#092C55" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="GobernArg Lite" />
    <meta property="og:title" content="GobernArg Lite · Gobernar es construir futuro" />
    <meta property="og:description" content="GobernArg Lite, la versión compacta: gobernás la Argentina, negociás con empresas, sindicatos y gobernadores, y buscás la reelección." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de GobernArg sobre una vista de Buenos Aires" />
    <meta name="twitter:title" content="GobernArg Lite" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Formulario del playtest (Fase 3): Netlify Forms lo detecta acá; el juego lo envía por fetch. -->
    <form name="playtest" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="version" /><input name="alias" /><input name="experiencia" /><input name="programa" />
      <input name="opinaba" /><textarea name="opinaba_por_que"></textarea><textarea name="no_entendi"></textarea>
      <input name="diversion" /><input name="claridad" /><input name="dificultad" /><input name="volveria" />
      <textarea name="comentarios"></textarea><textarea name="resumen"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
