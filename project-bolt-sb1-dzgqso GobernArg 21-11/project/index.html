<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Versión de prueba: no indexar en buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>GobernArg</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Formulario del playtest (Fase 3): Netlify Forms lo detecta acá; el juego lo envía por fetch. -->
    <form name="playtest" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="version" /><input name="alias" /><input name="experiencia" /><input name="programa" />
      <input name="opinaba" /><textarea name="opinaba_por_que"></textarea><textarea name="no_entendi"></textarea>
      <input name="diversion" /><input name="claridad" /><input name="dificultad" /><input name="volveria" />
      <textarea name="comentarios"></textarea><textarea name="resumen"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
