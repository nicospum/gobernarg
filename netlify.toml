# Despliegue en Netlify: el juego vive en una subcarpeta del repo.
[build]
  base = "project-bolt-sb1-dzgqso GobernArg 21-11/project"
  # URL la define Netlify: la vista previa al compartir necesita el link completo de la imagen.
  command = "VITE_SITE_URL=$URL npm run build"
  # Relativo a `base`.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Todavía no es público: que los buscadores no lo indexen.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
